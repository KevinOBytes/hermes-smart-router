[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smart-router"
version = "0.1.0"
description = "Hermes Agent model-provider plugin: task-aware model routing via local Gemma classification"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kevin O'Connor", email = "kevin@kevinbytes.com"},
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]
dev = [
    "build>=1.0",
    "wheel>=0.42",
]

[project.entry-points."hermes.model_providers"]
smart-router = "hermes_smart_router.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/hermes_smart_router/deterministic.py" = ["E501"]
"src/hermes_smart_router/classifier.py" = ["E501"]
"tests/test_classifier.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
